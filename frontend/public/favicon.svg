<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#15803d"/>
  <!-- Book outline -->
  <rect x="14" y="16" width="36" height="32" rx="3" fill="white" opacity="0.15"/>
  <rect x="14" y="16" width="17" height="32" rx="2" fill="white" opacity="0.9"/>
  <rect x="33" y="16" width="17" height="32" rx="2" fill="white" opacity="0.75"/>
  <!-- Spine line -->
  <line x1="32" y1="17" x2="32" y2="47" stroke="#15803d" stroke-width="1.5"/>
  <!-- Lines on left page -->
  <line x1="18" y1="25" x2="29" y2="25" stroke="#15803d" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="18" y1="30" x2="29" y2="30" stroke="#15803d" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="18" y1="35" x2="29" y2="35" stroke="#15803d" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="18" y1="40" x2="25" y2="40" stroke="#15803d" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Check mark on right page -->
  <polyline points="36,31 40,36 47,25" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
